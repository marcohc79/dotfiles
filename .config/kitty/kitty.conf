include themes/Rosé Pine.conf
term xterm-256color

# Window
window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 0

# Keybindings
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard

# Create new tabs and windows in current directory
map kitty_mod+t new_tab_with_cwd
map kitty_mod+n new_window_with_cwd

# Key bindings for common actions
map alt+left  neighboring_window left
map alt+right neighboring_window right
map alt+up    neighboring_window up
map alt+down  neighboring_window down

map alt+h   neighboring_window left
map alt+l   neighboring_window right
map alt+k   neighboring_window up
map alt+j   neighboring_window down

# Allow remote access
allow_remote_control yes

# Aesthetics
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor
enable_audio_bell no
cursor_trail 3

# Minimal Tab bar styling
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
active_tab_foreground   #191724
active_tab_background   #c4a7e7
inactive_tab_foreground #6e6a86
inactive_tab_background #26233a
tab_bar_background      #191724

# Border styling
window_border_width 1pt
draw_minimal_borders no
active_border_color   #9ccfd8
inactive_border_color #6e6a86
bell_border_color     #eb6f92

# Border and margin widths
window_margin_width 4
single_window_margin_width 0

# Scrolling log
scrollback_lines 10000

# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMonoNL Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0
# END_KITTY_FONTS
